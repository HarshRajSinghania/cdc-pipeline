services:
  # 1. The Source Database
  postgres:
    image: postgres:15-alpine
    container_name: postgres_source
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=inventory_db
    # CRITICAL: PostgreSQL must be configured with logical replication enabled for Debezium to work
    command: ["postgres", "-c", "wal_level=logical"]
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. Redis - lightweight sink for CDC events (no Kafka needed).
  #    Debezium Server 2.5 has no `file` sink, so the events land in a Redis
  #    stream and are exported to cdc-output/cdc_events.json afterwards.
  #    Append-only persistence keeps the captured events across restarts.
  redis:
    image: redis:7-alpine
    container_name: redis_sink
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  # 3. Debezium Server (Standalone, no Kafka required for this quick test)
  debezium:
    image: debezium/server:2.5
    container_name: debezium_server
    volumes:
      - ./debezium-conf:/debezium/conf
      - ./cdc-output:/debezium/data
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
  redisdata:
